[project]
name = "cx-pangram"
version = "0.1.0"
description = "Local EditLens (open-pangram) AI-edit detection: per-segment + aggregate scores, CLI + library"
readme = "README.md"
authors = [
    { name = "jmpaz", email = "30947643+jmpaz@users.noreply.github.com" }
]
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch>=2.4",
    "transformers>=4.44",
    "safetensors>=0.4",
    "emoji>=2.10",
    "numpy>=1.26",
    "rich>=13.7",
    "typer>=0.12",
    "huggingface-hub>=0.24",
]

[project.optional-dependencies]
llama = [
    "peft>=0.11",
    "bitsandbytes>=0.43",
    "accelerate>=0.30",
]

[project.scripts]
cx-pangram = "cx_pangram.cli:app"

[build-system]
requires = ["uv_build>=0.11.4,<0.12.0"]
build-backend = "uv_build"

[project]
name = "cx-pangram"
version = "0.1.0"
description = "Local EditLens (open-pangram) AI-edit detection: per-segment + aggregate scores, CLI + library"
readme = "README.md"
authors = [
    { name = "jmpaz", email = "30947643+jmpaz@users.noreply.github.com" }
]
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.4",
    "transformers>=5.0",
    "safetensors>=0.4",
    "emoji>=2.10",
    "numpy>=1.26",
    "rich>=13.7",
    "typer>=0.12",
    "huggingface-hub>=0.24",
    "peft>=0.11",
    "accelerate>=0.30",
]

[project.optional-dependencies]
cuda = [
    "bitsandbytes>=0.43",
]
contextualize = [
    "contextualize",
    "cx-plugins",
]

[project.scripts]
cx-pangram = "cx_pangram.cli:app"

[project.entry-points."contextualize.plugins"]
pangram = "cx_pangram.cx_plugin"

[tool.uv.sources]
contextualize = { git = "https://github.com/jmpaz/contextualize.git", branch = "main" }
cx-plugins = { git = "https://github.com/jmpaz/cx-plugins.git", branch = "main" }

[build-system]
requires = ["uv_build>=0.11.4,<0.12.0"]
build-backend = "uv_build"
